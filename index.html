<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My movie app</title>
    <meta name="description" content="A simple website"/>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <header><h1>🎬 MovieFinder</h1></header>

    <main>
        <form>
            <input>
            <button type="submit">search</button>
            <button type="button" id="clear-btn">Clear</button>
        </form>
        <p id="results">Search for a movie to begin</p>


        <div id="movie-card">
        <img id="poster" alt="Movie Poster" hidden>

          <div id="movie-details">
            <p id="plot"></p>
          <p id="rating"></p>
          <p id="genre"></p>
          <p id="director"></p>
          <p id="actors"></p>
          <p id="runtime"></p>
          </div>
        </div>
    </main>

    

    <script src="script.js"></script>
  </body>
  
</html>
